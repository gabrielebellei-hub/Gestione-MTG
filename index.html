<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestione MTG</title>
<meta name="theme-color" content="#1b2130">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gestione MTG">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #f3f4f7; }
  @media (prefers-color-scheme: dark) { html, body { background: #12151d; } }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; }
  #fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px;
    font: 16px/1.5 system-ui, sans-serif; text-align: center; color: #1b2130; }
  #fallback a { color: #b9770e; font-weight: 600; }
  #imp { position: fixed; inset: 0; z-index: 10; background: rgba(15,18,26,.6); display: none; align-items: center; justify-content: center; padding: 16px;
    font: 16px/1.45 system-ui, sans-serif; }
  #imp .box { background: #fff; color: #1b2130; border-radius: 14px; padding: 20px; width: 100%; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  #imp h2 { margin: 0 0 6px; font-size: 1.15rem; text-transform: uppercase; letter-spacing: .03em; }
  #imp label { display: block; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #5b6475; margin: 12px 0 4px; }
  #imp input { width: 100%; box-sizing: border-box; font: inherit; padding: 9px 10px; border: 1px solid #cfd4de; border-radius: 8px; }
  #imp .btns { display: flex; gap: 8px; margin-top: 16px; }
  #imp button { flex: 1; font: 600 15px system-ui, sans-serif; padding: 11px; border-radius: 8px; border: 1px solid #cfd4de; background: #fff; color: #1b2130; }
  #imp button.go { background: #b9770e; border-color: #b9770e; color: #fff; }
  #imp button:disabled { opacity: .6; }
  #imp .msg { margin-top: 12px; font-size: .92rem; }
  #imp .ok { color: #1f7a4d; } #imp .ko { color: #b42318; }
  @media (prefers-color-scheme: dark) { #imp .box { background: #1b2130; color: #eef0f5; } #imp input, #imp button { background: #12151d; color: #eef0f5; border-color: #3a4256; } }
</style>
</head>
<body>
<!-- Sostituisci l'indirizzo qui sotto se un giorno cambi il deployment di Apps Script -->
<iframe id="app"
  src="https://script.google.com/macros/s/AKfycbwr9LN-wIwtuTiKMNMW7UD747aGK9ASmHDwQJ8OAc7T6OGPcPstZ7w4b7zg8cxV71Xgmg/exec"
  allow="clipboard-write" title="Gestione MTG"></iframe>
<div id="imp" role="dialog" aria-modal="true" aria-labelledby="imptit">
  <div class="box">
    <h2 id="imptit">Importa collezione</h2>
    <div id="impinfo">Leggo il file…</div>
    <label for="impnome">Nome del binder</label><input id="impnome">
    <label for="imppin">PIN</label><input id="imppin" type="password" inputmode="numeric" autocomplete="off">
    <div class="btns"><button type="button" id="impno">Annulla</button><button type="button" class="go" id="impgo">Importa</button></div>
    <div class="msg" id="impmsg"></div>
  </div>
</div>
<div id="fallback">
  <p>Nessuna connessione o app non raggiungibile.<br><a href="./">Riprova</a></p>
</div>
<script>
  if (!navigator.onLine) { document.getElementById('fallback').style.display = 'flex'; }
  window.addEventListener('online', function () { location.reload(); });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
<script>
  // CSV condiviso da ManaBox (Android: Condividi -> Gestione MTG)
  (function () {
    if (!/[?&]condiviso=1/.test(location.search) || !('caches' in window)) return;
    var EXEC = document.getElementById('app').getAttribute('src');
    var $ = function (id) { return document.getElementById(id); };
    var dati = null;
    function chiudi() {
      caches.open('gestione-mtg-condivisi').then(function (c) { c.delete('./condiviso.json'); });
      $('imp').style.display = 'none';
      history.replaceState(null, '', './');
    }
    function pinSalvato() { try { return localStorage.getItem('gmtg-pin') || ''; } catch (e) { return ''; } }
    $('imp').style.display = 'flex';
    $('imppin').value = pinSalvato();
    caches.open('gestione-mtg-condivisi').then(function (c) { return c.match('./condiviso.json'); })
      .then(function (r) { return r ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.csv) { $('impinfo').textContent = 'Non ho ricevuto nessun file. Riprova a condividere il CSV da ManaBox.'; $('impgo').disabled = true; return; }
        dati = d;
        var righe = d.csv.split(/\r?\n/).filter(function (x) { return x.trim(); }).length - 1;
        $('impinfo').innerHTML = 'File <b></b> · ' + Math.max(righe, 0) + ' righe.';
        $('impinfo').querySelector('b').textContent = d.nome;
        $('impnome').value = String(d.nome).replace(/\.csv$/i, '').replace(/_+/g, ' ');
      });
    $('impno').onclick = chiudi;
    $('impgo').onclick = function () {
      if (!dati) return;
      var pin = $('imppin').value.trim();
      if (!pin) { $('impmsg').className = 'msg ko'; $('impmsg').textContent = 'Inserisci il PIN.'; return; }
      var b = this; b.disabled = true; b.textContent = 'Importo…'; $('impmsg').textContent = '';
      var req = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      function fine(x) {
        if (!x.ok) {
          $('impmsg').className = 'msg ko'; $('impmsg').textContent = 'Importazione non riuscita: ' + (x.errore || 'errore');
          b.disabled = false; b.textContent = 'Importa'; return;
        }
        try { localStorage.setItem('gmtg-pin', pin); } catch (e) {}
        var r = x.risultato || {};
        $('impmsg').className = 'msg ok';
        $('impmsg').textContent = 'Importato: ' + (r.binder || []).join(', ') + ' \u2013 ' + r.carte + ' carte (' + r.righe + ' righe). Le trovi in Carte \u2192 Collezione.';
        b.textContent = 'Fatto'; $('impno').textContent = 'Chiudi';
        $('app').src = EXEC;
      }
      // esito letto con JSONP: funziona anche quando il browser blocca la risposta del POST
      var tentativi = 0;
      function controlla() {
        tentativi++;
        var cb = 'gmtgEsito' + tentativi, s = document.createElement('script');
        window[cb] = function (x) {
          delete window[cb]; s.remove();
          if (x && !x.attesa) return fine(x);
          if (tentativi < 45) setTimeout(controlla, 2000);
          else fine({ ok: false, errore: 'nessuna risposta dal foglio. Controlla di aver pubblicato la nuova versione dello script.' });
        };
        s.onerror = function () { s.remove(); if (tentativi < 45) setTimeout(controlla, 2000); else fine({ ok: false, errore: 'app non raggiungibile.' }); };
        s.src = EXEC + '?cb=' + cb + '&req=' + req + '&t=' + Date.now();
        document.body.appendChild(s);
      }
      fetch(EXEC, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ azione: 'importaCollezione', req: req, pin: pin, nome: $('impnome').value.trim() || dati.nome, csv: dati.csv }) })
        .catch(function () {})
        .then(function () { $('impmsg').className = 'msg'; $('impmsg').textContent = 'Inviato, attendo la conferma dal foglio\u2026'; setTimeout(controlla, 1500); });
    };
  })();
</script>
</body>
</html>
